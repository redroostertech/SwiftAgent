name: SwiftAgentNotes
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.swiftagent.demos
  xcodeVersion: "16.0"

packages:
  SwiftAgent:
    path: ../..

targets:
  SwiftAgentNotes:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftAgent
        product: SwiftAgent
      - package: SwiftAgent
        product: SwiftAgentHTTPClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftagent.demos.notes
        PRODUCT_NAME: SwiftAgent Notes
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SwiftAgent Notes uses the local network to expose tools to nearby agent clients."
        INFOPLIST_KEY_NSBonjourServices: "_swiftagent._tcp"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
