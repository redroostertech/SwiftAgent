name: SwiftAgentNotes
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.swiftagent.demos
  xcodeVersion: "16.0"

packages:
  SwiftAgent:
    path: ../..

targets:
  SwiftAgentNotes:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SwiftAgent
        product: SwiftAgent
      - package: SwiftAgent
        product: SwiftAgentHTTPClient
      - package: SwiftAgent
        product: SwiftAgentOpenAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftagent.demos.notes
        PRODUCT_NAME: SwiftAgent Notes
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: false
